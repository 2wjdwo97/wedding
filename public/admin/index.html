<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청첩장 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 로그인 화면 ===== -->
<div id="loginView" class="view">
    <div class="login-box">
        <div class="login-logo">
            <div class="login-logo-symbol">♡</div>
            <h1 class="login-title">이정재 · 임효진</h1>
            <p class="login-subtitle">관리자 페이지</p>
        </div>
        <form id="loginForm">
            <div>
                <label class="form-label" for="loginId">아이디</label>
                <input type="text" id="loginId" placeholder="아이디를 입력하세요" autocomplete="username" required>
            </div>
            <div>
                <label class="form-label" for="loginPw">비밀번호</label>
                <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
            </div>
            <button type="submit" id="loginBtn">로그인</button>
        </form>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<!-- ===== 대시보드 ===== -->
<div id="dashView" class="view hidden">
    <header class="dash-header">
        <span class="dash-title">청첩장 관리자</span>
        <button id="logoutBtn" class="btn-logout">로그아웃</button>
    </header>

    <main class="dash-main">
        <!-- 탭 -->
        <nav class="admin-tabs">
            <button class="admin-tab active" data-tab="guestbook">방명록</button>
            <button class="admin-tab" data-tab="rsvp">참석 현황</button>
        </nav>

        <!-- ── 방명록 탭 ── -->
        <div id="tabGuestbook" class="tab-panel">
            <div class="stat-row">
                <div class="stat-card">
                    <span class="stat-label">총 방명록</span>
                    <span class="stat-value" id="totalCount">-</span>
                </div>
                <div class="stat-card lock-card">
                    <span class="stat-label">방명록 잠금</span>
                    <label class="toggle">
                        <input type="checkbox" id="lockToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>

            <div class="section-header">
                <h2 class="section-title">방명록</h2>
                <a href="/api/admin/comments/export" class="btn-csv" download="guestbook.csv">CSV 저장</a>
            </div>

            <div id="commentsList" class="comments-list"></div>
            <div id="pagination" class="pagination"></div>
        </div>

        <!-- ── 참석 현황 탭 ── -->
        <div id="tabRsvp" class="tab-panel hidden">
            <div class="stat-row">
                <div class="stat-card">
                    <span class="stat-label">총 응답</span>
                    <span class="stat-value" id="rsvpTotal">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">참석 가능</span>
                    <span class="stat-value attend-yes" id="rsvpAttending">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">불참</span>
                    <span class="stat-value attend-no" id="rsvpNotAttending">-</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">식사 포함</span>
                    <span class="stat-value" id="rsvpMeal">-</span>
                </div>
            </div>

            <div class="section-header">
                <h2 class="section-title">참석 현황</h2>
                <a href="/api/admin/rsvp/export" class="btn-csv" download="rsvp.csv">CSV 저장</a>
            </div>

            <div class="side-filter">
                <button class="side-filter-btn active" data-side="">전체</button>
                <button class="side-filter-btn" data-side="신랑측">신랑측</button>
                <button class="side-filter-btn" data-side="신부측">신부측</button>
            </div>

            <div id="rsvpList" class="comments-list"></div>
            <div id="rsvpPagination" class="pagination"></div>
        </div>
    </main>
</div>

<script>
let currentPage = 1;
let rsvpCurrentPage = 1;
let rsvpSideFilter = '';

document.querySelectorAll('.side-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.side-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rsvpSideFilter = btn.dataset.side;
        loadRsvp(1);
    });
});

// ── 탭 전환 ──
document.querySelectorAll('.admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById(tab === 'rsvp' ? 'tabRsvp' : 'tabGuestbook').classList.remove('hidden');
        if (tab === 'rsvp') loadRsvp(1);
    });
});

// ── 초기화 ──
async function init() {
    const res = await fetch('/api/admin/comments?page=1', { credentials: 'include' });
    if (res.ok) {
        showDashboard(await res.json());
    } else {
        showLogin();
    }
}

function showLogin() {
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('dashView').classList.add('hidden');
}

function showDashboard(data) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('dashView').classList.remove('hidden');
    renderComments(data);
    loadSettings();
}

// ── 로그인 ──
document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = '로그인 중...';
    errEl.textContent = '';

    const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
            id: document.getElementById('loginId').value,
            password: document.getElementById('loginPw').value,
        }),
    });

    if (res.ok) {
        const data = await (await fetch('/api/admin/comments?page=1', { credentials: 'include' })).json();
        showDashboard(data);
    } else {
        const d = await res.json();
        errEl.textContent = d.error || '로그인에 실패했습니다.';
    }
    btn.disabled = false;
    btn.textContent = '로그인';
});

// ── 로그아웃 ──
document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
    showLogin();
});

// ── 설정 ──
async function loadSettings() {
    const res = await fetch('/api/admin/settings', { credentials: 'include' });
    if (!res.ok) return;
    const { guestbook_locked } = await res.json();
    document.getElementById('lockToggle').checked = guestbook_locked;
}

document.getElementById('lockToggle').addEventListener('change', async e => {
    await fetch('/api/admin/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ guestbook_locked: e.target.checked }),
    });
});

// ── 공통 유틸 ──
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
}

function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── 방명록 ──
function renderComments({ comments, total, page, totalPages }) {
    document.getElementById('totalCount').textContent = `${total}건`;
    currentPage = page;

    const list = document.getElementById('commentsList');
    if (comments.length === 0) {
        list.innerHTML = '<p class="empty">방명록이 없습니다.</p>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    list.innerHTML = comments.map(c => `
        <div class="comment-item" data-id="${c.id}">
            <div class="comment-meta">
                <span class="comment-name">${escapeHtml(c.name)}</span>
                <span class="comment-date">${formatDate(c.created_at)}</span>
            </div>
            ${c.drawing ? `<img class="admin-drawing" src="${c.drawing}" alt="얼굴 그림">` : ''}
            <p class="comment-content">${escapeHtml(c.content)}</p>
            <div class="comment-actions">
                <button class="btn-delete" data-id="${c.id}">삭제</button>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteComment(btn.dataset.id));
    });

    renderPagination('pagination', totalPages, page, loadComments);
}

async function loadComments(page) {
    const res = await fetch(`/api/admin/comments?page=${page}`, { credentials: 'include' });
    if (!res.ok) { showLogin(); return; }
    renderComments(await res.json());
}

async function deleteComment(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    const res = await fetch(`/api/admin/comments/${id}`, { method: 'DELETE', credentials: 'include' });
    if (res.ok) await loadComments(currentPage);
}

async function deleteRsvp(id) {
    if (!confirm('삭제하시겠습니까?')) return;
    const res = await fetch(`/api/admin/rsvp/${id}`, { method: 'DELETE', credentials: 'include' });
    if (res.ok) await loadRsvp(rsvpCurrentPage);
}

// ── 참석 현황 ──
async function loadRsvp(page) {
    rsvpCurrentPage = page;
    const sideParam = rsvpSideFilter ? `&side=${encodeURIComponent(rsvpSideFilter)}` : '';
    const res = await fetch(`/api/admin/rsvp?page=${page}${sideParam}`, { credentials: 'include' });
    if (!res.ok) { showLogin(); return; }
    const data = await res.json();

    document.getElementById('rsvpTotal').textContent       = `${data.stats.total}건`;
    document.getElementById('rsvpAttending').textContent   = `${data.stats.attending}명`;
    document.getElementById('rsvpNotAttending').textContent = `${data.stats.notAttending}명`;
    document.getElementById('rsvpMeal').textContent        = `${data.stats.meal}명`;

    const list = document.getElementById('rsvpList');
    if (data.rsvps.length === 0) {
        list.innerHTML = '<p class="empty">참석 응답이 없습니다.</p>';
        document.getElementById('rsvpPagination').innerHTML = '';
        return;
    }

    list.innerHTML = data.rsvps.map(r => `
        <div class="comment-item rsvp-item">
            <div class="comment-meta">
                <span class="comment-name">
                    ${escapeHtml(r.name || '(미입력)')}
                    ${r.side ? `<span class="rsvp-side">${escapeHtml(r.side)}</span>` : ''}
                    <span class="rsvp-badge ${r.attend === '가능' ? 'badge-yes' : 'badge-no'}">${escapeHtml(r.attend)}</span>
                </span>
                <span class="comment-date">${formatDate(r.created_at)}</span>
            </div>
            <div class="rsvp-detail">
                ${r.phone ? `<span>📞 ${escapeHtml(r.phone)}</span>` : ''}
                ${r.extra_guests ? `<span>👥 추가 ${r.extra_guests}명</span>` : ''}
                ${r.meal ? `<span>🍽 ${escapeHtml(r.meal)}</span>` : ''}
                ${r.message ? `<span>💬 ${escapeHtml(r.message)}</span>` : ''}
            </div>
            <div class="comment-actions">
                <button class="btn-delete" data-id="${r.id}">삭제</button>
            </div>
        </div>
    `).join('');

    list.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteRsvp(btn.dataset.id));
    });

    renderPagination('rsvpPagination', data.totalPages, page, loadRsvp);
}

function renderPagination(containerId, totalPages, currentPage, loadFn) {
    const pag = document.getElementById(containerId);
    pag.innerHTML = '';
    for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        btn.textContent = i;
        btn.addEventListener('click', () => loadFn(i));
        pag.appendChild(btn);
    }
}

init();
</script>
</body>
</html>
